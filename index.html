<h1>Python Path · By Sir Aryan</h1>
<p>Free interactive Python course for Edexcel IGCSE Computer Science Paper 2: animated lessons, exercises and past-paper practice. By Sir Aryan, for Beacon Light Academy.</p>
<p><strong>JavaScript is needed</strong> to run Python in the browser. Please turn it on and reload this page.</p>
<h2>Modules</h2>
<ul><li><strong>Start here</strong>: Your first program, printing, comments and what to do when Python complains.<ul><li><a href="/learn/first-program/">Your first program</a></li><li><a href="/learn/print-in-depth/">Controlling your output</a></li><li><a href="/learn/comments-style/">Comments and readable code</a></li><li><a href="/learn/errors-debugging/">Errors, and how to fix them</a></li></ul></li><li><strong>Variables and data types</strong>: Storing values, the four basic types, arithmetic, input(), type casting and random numbers.<ul><li><a href="/learn/variables/">Variables: storing values</a></li><li><a href="/learn/data-types/">Data types</a></li><li><a href="/learn/arithmetic/">Arithmetic and operators</a></li><li><a href="/learn/input-casting/">Getting input from the user</a></li><li><a href="/learn/formatting-output/">Formatting output with f-strings</a></li><li><a href="/learn/random-math/">Random numbers and the math module</a></li></ul></li><li><strong>Selection (if statements)</strong>: Make programs decide: comparisons, if / elif / else, and / or / not, nested decisions and everyday patterns.<ul><li><a href="/learn/comparisons/">Comparing values</a></li><li><a href="/learn/if-else/">if and else</a></li><li><a href="/learn/elif-chains/">elif: more than two choices</a></li><li><a href="/learn/logical-operators/">and, or, not</a></li><li><a href="/learn/nested-if/">Nested decisions</a></li><li><a href="/learn/selection-patterns/">Selection patterns you will reuse</a></li></ul></li><li><strong>Iteration (loops)</strong>: Repeat instructions with while and for loops, build totals and counters, nest loops, and stop early with break.<ul><li><a href="/learn/while-loops/">while loops</a></li><li><a href="/learn/for-loops/">for loops and range()</a></li><li><a href="/learn/loop-patterns/">Loop patterns: totals, counts, max and more</a></li><li><a href="/learn/nested-loops/">Loops inside loops</a></li><li><a href="/learn/break-continue/">break, continue and while True</a></li><li><a href="/learn/repeat-until/">Repeat until: input loops and exam pseudocode</a></li></ul></li><li><strong>Strings</strong>: Text as a sequence of characters: indexing, slicing, methods, loops over text and classic string algorithms.<ul><li><a href="/learn/string-basics/">Strings: characters, length and index</a></li><li><a href="/learn/string-slicing/">Slicing strings</a></li><li><a href="/learn/string-methods/">String methods</a></li><li><a href="/learn/string-traversal/">Going through a string</a></li><li><a href="/learn/string-patterns/">String algorithms</a></li></ul></li><li><strong>Lists (1D arrays)</strong>: Store many values under one name: create, index, change, loop and process lists, and avoid the classic list traps.<ul><li><a href="/learn/list-basics/">Lists: creating and indexing</a></li><li><a href="/learn/list-methods/">List methods</a></li><li><a href="/learn/list-loops/">Looping over lists</a></li><li><a href="/learn/list-algorithms/">List algorithms</a></li><li><a href="/learn/list-pitfalls/">List traps and safe code</a></li></ul></li><li><strong>2D lists and records</strong>: Tables of data: lists inside lists, nested loops over grids, classic grid algorithms and records.<ul><li><a href="/learn/two-d-basics/">2D lists: rows and columns</a></li><li><a href="/learn/two-d-loops/">Looping over grids</a></li><li><a href="/learn/two-d-algorithms/">2D algorithms</a></li><li><a href="/learn/records/">Records and tables of data</a></li></ul></li><li><strong>Subprograms</strong>: Procedures, functions, parameters, return values, scope and menu-driven programs.<ul><li><a href="/learn/functions-intro/">Your first subprograms</a></li><li><a href="/learn/parameters-return/">Parameters and return values</a></li><li><a href="/learn/procedures-functions/">Procedures, functions and helper subprograms</a></li><li><a href="/learn/scope/">Scope: local and global variables</a></li><li><a href="/learn/functions-and-lists/">Subprograms and lists</a></li><li><a href="/learn/menus/">Menu-driven programs</a></li></ul></li><li><strong>Validation, testing and tracing</strong>: Stop bad data, choose test data, fill in trace tables and fix broken programs.<ul><li><a href="/learn/validation/">Validation checks</a></li><li><a href="/learn/input-validation/">Validating input with loops</a></li><li><a href="/learn/test-data/">Test data and test plans</a></li><li><a href="/learn/trace-tables/">Trace tables</a></li><li><a href="/learn/amend-the-code/">Amend the code: finding and fixing errors</a></li></ul></li><li><strong>More Python tools</strong>: Tuples, dictionaries, comprehensions, enumerate, zip, sorting with a key, and recursion.<ul><li><a href="/learn/tuples-dicts/">Tuples and dictionaries</a></li><li><a href="/learn/comprehensions/">List comprehensions (optional power tool)</a></li><li><a href="/learn/enumerate-zip/">enumerate, zip and sorting with a key</a></li><li><a href="/learn/recursion/">Recursion</a></li></ul></li><li><strong>Text files</strong>: Open, read, write and append text files, and turn files into lists and back again.<ul><li><a href="/learn/files-reading/">Reading a text file</a></li><li><a href="/learn/files-writing/">Writing and appending</a></li><li><a href="/learn/files-with-lists/">Files and lists</a></li><li><a href="/learn/files-2d/">Files of records</a></li><li><a href="/learn/files-subprograms/">Files and subprograms</a></li></ul></li><li><strong>Searching and sorting</strong>: Linear and binary search, bubble sort and merge sort, and how to compare their speed.<ul><li><a href="/learn/linear-search/">Linear search</a></li><li><a href="/learn/binary-search/">Binary search</a></li><li><a href="/learn/bubble-sort/">Bubble sort</a></li><li><a href="/learn/merge-sort/">Merge sort</a></li><li><a href="/learn/algorithm-efficiency/">Comparing algorithms</a></li></ul></li><li><strong>Data, binary and encryption</strong>: Binary and hex in code, shifts, characters as numbers, the Caesar cipher and run length encoding.<ul><li><a href="/learn/binary-hex/">Binary and hexadecimal in code</a></li><li><a href="/learn/bitwise-shifts/">Shifts and bitwise operators</a></li><li><a href="/learn/ascii-ord-chr/">Characters as numbers: ord and chr</a></li><li><a href="/learn/caesar-cipher/">Caesar cipher</a></li><li><a href="/learn/rle/">Run length encoding</a></li></ul></li><li><strong>Exam practice</strong>: Turn Edexcel pseudocode into Python, then tackle Paper 2 style scenarios, amend-the-code tasks and mini-projects.<ul><li><a href="/learn/pseudocode-to-python/">Pseudocode to Python</a></li><li><a href="/learn/exam-programs/">Paper 2 style programs</a></li><li><a href="/learn/exam-debugging/">Amend the code</a></li><li><a href="/learn/mini-projects/">Mini projects</a></li></ul></li><li><strong>Design, flowcharts and evaluation</strong>: Break problems down, draw and read flowcharts, answer questions about code, complete skeleton programs and judge your own work.<ul><li><a href="/learn/decomposition-abstraction/">Decomposition and abstraction</a></li><li><a href="/learn/flowcharts/">Flowcharts</a></li><li><a href="/learn/flowchart-to-code/">From flowchart to code and back</a></li><li><a href="/learn/reading-code/">Reading code: questions about a program</a></li><li><a href="/learn/ide-evaluation/">IDEs, debugging and evaluating programs</a></li><li><a href="/learn/complete-the-code/">Complete the code</a></li></ul></li><li><strong>Past-paper practice</strong>: Eleven recurring Paper 2 patterns, each with a worked example and original exam-style tasks, finishing with a timed mixed test.<ul><li><a href="/learn/pp-test-data-tables/">Test data tables</a></li><li><a href="/learn/pp-amend-errors/">Amend the code: find the errors</a></li><li><a href="/learn/pp-selection-bonus/">Selection with and / or (bonus and tier rules)</a></li><li><a href="/learn/pp-validation-formats/">Validating formats and rejecting entries</a></li><li><a href="/learn/pp-arrays-1d/">One-dimensional arrays: counts, totals and extremes</a></li><li><a href="/learn/pp-arrays-2d/">Two-dimensional arrays: tables of data</a></li><li><a href="/learn/pp-subprograms-menus/">Subprograms and menus</a></li><li><a href="/learn/pp-text-files/">Text files: records, searches and reports</a></li><li><a href="/learn/pp-sorting-searching/">Sorting and searching from a description</a></li><li><a href="/learn/pp-ciphers-encoding/">Ciphers and encoding</a></li><li><a href="/learn/pp-games/">Games: guessing, word and dice programs</a></li><li><a href="/learn/pp-mixed-test/">Timed practice: mixed test</a></li></ul></li></ul>
</div>
